name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gates:
    name: Format, Clippy, & Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 2024 toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run unit and CLI integration tests
        run: cargo test --workspace

      - name: Build bundled Soroban example contracts (wasm32-unknown-unknown)
        run: |
          cargo build --manifest-path examples/vulnerable-vault/Cargo.toml --target wasm32-unknown-unknown --release
          cargo build --manifest-path examples/upgrade-v1/Cargo.toml --target wasm32-unknown-unknown --release
          cargo build --manifest-path examples/upgrade-v2-broken/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Self-Dogfood SORARK CLI on Example Contracts & Compiled WASMs
        run: |
          cargo run -p sorark-cli -- --deny-warnings lint examples/upgrade-v1
          cargo run -p sorark-cli -- inspect examples/upgrade-v1/target/wasm32-unknown-unknown/release/upgrade_v1.wasm
          cargo run -p sorark-cli -- rules

      - name: Self-Test Composite GitHub Action (lint clean contract)
        id: action-lint
        uses: ./
        with:
          command: lint
          path: examples/upgrade-v1
          format: markdown
          deny-warnings: 'true'
          step-summary: 'true'

      - name: Self-Test Composite GitHub Action (diff incompatible upgrade)
        id: action-diff
        uses: ./
        with:
          command: diff
          old: examples/upgrade-v1
          new: examples/upgrade-v2-broken
          format: sarif
          fail-on-error: 'false'

      - name: Verify Composite Action outputs
        shell: bash
        env:
          LINT_EXIT: ${{ steps.action-lint.outputs.exit-code }}
          LINT_REPORT: ${{ steps.action-lint.outputs.report-path }}
          DIFF_EXIT: ${{ steps.action-diff.outputs.exit-code }}
          DIFF_REPORT: ${{ steps.action-diff.outputs.report-path }}
        run: |
          set -euo pipefail
          test "$LINT_EXIT" = "0"
          test -f "$LINT_REPORT"
          test "$DIFF_EXIT" = "1"
          test -s "$DIFF_REPORT"
